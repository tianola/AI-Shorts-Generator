name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Never let a test open the real storage/app.db.
      TEST_DATABASE_URL: "sqlite:///:memory:"
      LOG_CONSOLE_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # The image already ships ffmpeg; ffprobe comes with it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Syntax-check the frontend
        run: node --check backend/static/app.js

      - name: Run backend tests
        run: python -m pytest -q --timeout=180

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # F = pyflakes (undefined names, unused imports, dead assignments);
      # E9 = syntax errors. Non-blocking for now: the codebase still has
      # legacy unused imports that would turn every run red.
      - name: Ruff
        continue-on-error: true
        run: ruff check backend --select F,E9
