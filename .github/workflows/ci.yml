name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Never let a test open the real storage/app.db.
      TEST_DATABASE_URL: "sqlite:///:memory:"
      LOG_CONSOLE_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      # The image already ships ffmpeg; ffprobe comes with it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock -r backend/requirements-dev.txt

      - name: Syntax-check the frontend
        run: for f in backend/static/js/*.js; do node --check "$f" || exit 1; done

      - name: Run backend tests
        run: python -m pytest -q --timeout=180

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # F = pyflakes (undefined names, unused imports, dead assignments);
      # E9 = syntax errors. The backlog of legacy unused imports is gone and
      # the tree is clean, so a new undefined name now fails the build.
      - name: Ruff
        run: ruff check backend --select F,E9
      # requirements.lock must still satisfy requirements.txt. uv keeps the
      # existing pins when it can, so this only changes the file when someone
      # edited requirements.txt without regenerating the lock.
      - name: Lock file matches requirements.txt
        run: |
          pip install uv
          cd backend
          uv pip compile requirements.txt --universal --python-version 3.11 -o requirements.lock -q
          git diff --exit-code requirements.lock
